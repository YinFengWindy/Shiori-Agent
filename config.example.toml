# =============================================================================
# 可选：LLM 配置；留空时可启动应用，在设置中添加模型后使用对话能力。
# api_key 可以直接填字符串，也可以用 ${ENV_VAR} 引用环境变量。
# =============================================================================

[llm]
registrations = []

# 添加模型时删除 registrations = []，再使用下列注册格式：
# [[llm.registrations]]
# id = "00000000-0000-4000-a000-000000000001"
# provider = "openai"
# model = "your-model"
# api_key = "${MODEL_API_KEY}"
# base_url = "https://your-provider.example/v1"
# effort = "none"
# model_context_window = 128000 # 必须按服务商文档填写实际容量
# model_auto_compact_token_limit = 96000 # 可选，须小于窗口；不填按 agent.context.trigger_ratio 计算

# =============================================================================
# Agent 行为
# =============================================================================

[agent]
max_tokens = 8192
# 设为 0 表示不限制迭代轮数；长任务仍可用 /stop 中断。
max_iterations = 40
dev_mode = false

[desktop.chat]
# 桌面端角色回复是否实时显示 Thinking 与正文增量。
streaming_enabled = false

[agent.context]
# 工作摘要成品上限；必须是正整数。
summary_token_limit = 2000
trigger_ratio = 0.75
target_ratio = 0.4
safety_margin_tokens = 4096
memory_window = 40

[agent.tools]
search_enabled = true

# 可选：长期记忆整理任务（默认已启用，通常无需修改）
# [agent.maintenance]
# memory_optimizer_enabled = true
# memory_optimizer_interval_seconds = 64800
# 输入预算策略见 [agent.context]，不再使用固定历史 token 阈值。

# 可选：控制加载哪些工具集（默认值适合大多数场景）
# [agent.wiring]
# toolsets = ["meta_common", "spawn", "schedule", "mcp"]

# =============================================================================
# 可选：桌面端对话不需要外部渠道。要使用 Telegram、QQ（NapCat）、
# 官方 QQBot 或飞书，请先创建角色，再在角色页添加对应插件账号。
# 账号身份、所属角色、响应规则和凭据由插件保存，不写入 config.toml。
# 设置 › 插件 只控制插件启停。
# =============================================================================

# =============================================================================
# 语义记忆
# default memory 的检索阈值在 workspace/plugin-data/default_memory/config.local.toml。
# =============================================================================

[memory]
enabled = true
# 语义记忆 engine 选择。留空等同 default。
engine = ""

[memory.embedding]
model = "text-embedding-v3"
api_key = "sk-..."
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"

# =============================================================================
# 配置升级记录（由程序维护，请勿修改）
# 这里列出的插件已按当前的默认启停状态初始化。
# =============================================================================

[_migrations]
plugin_default_disabled = ["browser_use", "computer_use", "novelai"]
proactive_target_removed = true
