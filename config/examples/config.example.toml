# =============================================================================
# 可选：LLM 配置；留空时可启动应用，在设置中添加模型后使用对话能力。
# api_key 可以直接填字符串，也可以用 ${ENV_VAR} 引用环境变量。
# =============================================================================

[llm]
registrations = []

# 添加模型时删除 registrations = []，再使用下列注册格式：
# [[llm.registrations]]
# id = "00000000-0000-4000-a000-000000000001"
# provider = "openai"
# model = "your-model"
# api_key = "${MODEL_API_KEY}"
# base_url = "https://your-provider.example/v1"
# effort = "none"

# =============================================================================
# 可选：桌宠语音交互
# 密钥可以直接填写，也可以使用 ${ENV_VAR}。
# =============================================================================

[voice]
enabled = false
hotkey = "Ctrl+Space"
microphone_device_id = ""

[voice.asr]
enabled = false
provider = "tencent"
base_url = "https://asr.tencentcloudapi.com/"
secret_id = ""
secret_key = ""

[voice.tts]
enabled = false
provider = "minimax"
base_url = "https://api.minimaxi.com/v1/t2a_v2"
model = "speech-2.8-turbo"
api_key = ""
volume = 2.0

# =============================================================================
# Agent 行为
# =============================================================================

[agent]
max_tokens = 8192
# 设为 0 表示不限制迭代轮数；长任务仍可用 /stop 中断。
max_iterations = 40
dev_mode = false

[desktop.chat]
# 桌面端角色回复是否实时显示 Thinking 与正文增量。
streaming_enabled = false

[agent.context]
memory_window = 40

[agent.tools]
search_enabled = true

# 可选：长期记忆整理任务（默认已启用，通常无需修改）
# [agent.maintenance]
# memory_optimizer_enabled = true
# memory_optimizer_interval_seconds = 64800
# consolidation_input_token_threshold = 75000

# 可选：控制加载哪些工具集（默认值适合大多数场景）
# [agent.wiring]
# toolsets = ["meta_common", "spawn", "schedule", "mcp"]

# =============================================================================
# 必填：至少配置一个渠道插件（Telegram、QQ（NapCat）、官方 QQBot 或飞书选其一）
# 凭据字段为空时该渠道自动跳过，不会报错；也可在 设置 › 插件 中填写。
# =============================================================================

# Telegram 渠道插件（也可在 设置 › 插件 › Telegram 中填写）。
[plugins.telegram]
# BotFather 给的 bot token，格式：123456789:AAF...
token = ""

# QQ（NapCat）渠道插件（也可在 设置 › 插件 › QQ（NapCat） 中填写）。
[plugins.qq]
# 填 Bot QQ 号启用，留空跳过。
bot_uin = ""
# NapCat 正向 WebSocket 地址与令牌；留空沿用 NcatBot 默认值（ws://localhost:3001）。
# ws_uri = ""
# ws_token = ""
websocket_open_timeout_seconds = 5.0

# 可选：QQ 开放平台官方机器人，使用官方 Gateway 和 REST API。
# [plugins.qqbot]
# app_id = ""
# client_secret = ""
# allow_from = []

# 可选：飞书 / Lark 企业自建应用机器人（长连接收消息，私聊 + 流式卡片）。
# 开发者后台配置步骤见 plugins/feishu/TESTING.md。
# [plugins.feishu]
# app_id = ""
# app_secret = "${FEISHU_APP_SECRET}"
# domain = "feishu"  # Lark 国际版填 "lark"

# =============================================================================
# 语义记忆
# default memory 的检索阈值在 workspace/plugin-data/default_memory/config.local.toml。
# =============================================================================

[memory]
enabled = true
# 语义记忆 engine 选择。留空等同 default。
engine = ""

[memory.embedding]
model = "text-embedding-v3"
api_key = "sk-..."
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"

# novelai 插件配置（issue #180 起归位为共置插件；旧版 [integrations.novelai]
# 在首次启动时自动一次性迁移到这里，无需手动改动既有配置文件）。
[plugins.novelai]
enabled = false
token = "${NOVELAI_TOKEN}"
base_url = "https://image.novelai.net"
default_model = "nai-diffusion-4-5-curated"
nsfw_model = "nai-diffusion-4-5-full"
nsfw_enabled = false
allow_txt2img = true
allow_img2img = true
auto_writeback_role_assets = false
max_pixels = 1048576
max_steps = 28
default_samples = 1
