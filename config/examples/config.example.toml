# =============================================================================
# 可选：LLM 配置；留空时可启动应用，在设置中添加模型后使用对话能力。
# api_key 可以直接填字符串，也可以用 ${ENV_VAR} 引用环境变量。
# =============================================================================

[llm]
registrations = []

# 添加模型时删除 registrations = []，再使用下列注册格式：
# [[llm.registrations]]
# id = "00000000-0000-4000-a000-000000000001"
# provider = "openai"
# model = "your-model"
# api_key = "${MODEL_API_KEY}"
# base_url = "https://your-provider.example/v1"
# effort = "none"

# =============================================================================
# 可选：桌宠语音交互
# 密钥可以直接填写，也可以使用 ${ENV_VAR}。
# =============================================================================

[voice]
enabled = false
hotkey = "Ctrl+Space"
microphone_device_id = ""

[voice.asr]
enabled = false
provider = "tencent"
base_url = "https://asr.tencentcloudapi.com/"
secret_id = ""
secret_key = ""

[voice.tts]
enabled = false
provider = "minimax"
base_url = "https://api.minimaxi.com/v1/t2a_v2"
model = "speech-2.8-turbo"
api_key = ""
volume = 2.0

# =============================================================================
# Agent 行为
# =============================================================================

[agent]
max_tokens = 8192
# 设为 0 表示不限制迭代轮数；长任务仍可用 /stop 中断。
max_iterations = 40
dev_mode = false

[desktop.chat]
# 桌面端角色回复是否实时显示 Thinking 与正文增量。
streaming_enabled = false

[agent.context]
memory_window = 40

[agent.tools]
search_enabled = true

# 可选：长期记忆整理任务（默认已启用，通常无需修改）
# [agent.maintenance]
# memory_optimizer_enabled = true
# memory_optimizer_interval_seconds = 64800
# consolidation_input_token_threshold = 75000

# 可选：控制加载哪些工具集（默认值适合大多数场景）
# [agent.wiring]
# toolsets = ["meta_common", "spawn", "schedule", "mcp"]

# =============================================================================
# 可选：桌面端对话不需要外部渠道。要使用 Telegram、QQ（NapCat）、
# 官方 QQBot 或飞书，请先创建角色，再在角色页添加对应插件账号。
# 账号身份、所属角色、响应规则和凭据由插件保存，不写入 config.toml。
# 设置 › 插件 只控制插件启停。
# =============================================================================

# =============================================================================
# 语义记忆
# default memory 的检索阈值在 workspace/plugin-data/default_memory/config.local.toml。
# =============================================================================

[memory]
enabled = true
# 语义记忆 engine 选择。留空等同 default。
engine = ""

[memory.embedding]
model = "text-embedding-v3"
api_key = "sk-..."
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"

# novelai 插件配置（issue #180 起归位为共置插件；旧版 [integrations.novelai]
# 在首次启动时自动一次性迁移到这里，无需手动改动既有配置文件）。
[plugins.novelai]
enabled = false
token = "${NOVELAI_TOKEN}"
base_url = "https://image.novelai.net"
default_model = "nai-diffusion-4-5-curated"
nsfw_model = "nai-diffusion-4-5-full"
nsfw_enabled = false
allow_txt2img = true
allow_img2img = true
auto_writeback_role_assets = false
max_pixels = 1048576
max_steps = 28
default_samples = 1

# =============================================================================
# 配置升级记录（由程序维护，请勿修改）
# 这里列出的插件已按当前的默认启停状态初始化：Browser Use、Computer Use 新安装时
# 默认停用，可在 设置 › 插件 中开启。
# =============================================================================

[_migrations]
plugin_default_disabled = ["browser_use", "computer_use"]
proactive_target_removed = true
