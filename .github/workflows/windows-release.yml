name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install desktop dependencies
        run: |
          npm ci
          npm --prefix desktop ci --no-audit --no-fund

      - name: Run focused release checks
        run: |
          python -m pytest -q tests/test_main.py
          npm --prefix desktop run typecheck
          npm test
          npm --prefix desktop run test:package

      - name: Build Windows installer and unpacked artifact
        run: npm --prefix desktop run package:win

      - name: Verify packaged layout
        run: npm --prefix desktop run verify:package

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Shiori-Windows-x64
          path: desktop/release/installer/*
          if-no-files-found: error

      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: desktop/release/installer/*
