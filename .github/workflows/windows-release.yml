name: Windows release

on:
  schedule:
    # GitHub cron uses UTC: 04:00 is 12:00 in Asia/Shanghai.
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Serialize scheduled, manual and tag builds; never cancel a release in progress.
concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # Drafts are visible only with push access; inherit contents: write so failed
    # automatic drafts can be discovered and resumed without creating duplicates.
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Plan daily release
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node apps/desktop/scripts/daily-release.mjs plan

  package:
    needs: plan
    if: >-
      always() && !cancelled() &&
      (github.event_name != 'schedule' ||
       (needs.plan.result == 'success' && needs.plan.outputs.should_release == 'true'))
    runs-on: windows-latest
    # pnpm --filter shiori-desktop runs scripts with apps/desktop as cwd, so this
    # path resolves to apps/desktop/release/installer.
    env:
      SHIORI_RELEASE_OUTPUT: release/installer
      SHIORI_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Resolve release version
        if: github.event_name != 'schedule'
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -match '^v(.+)$') {
            "SHIORI_RELEASE_VERSION=$($Matches[1])" >> $env:GITHUB_ENV
          } else {
            "SHIORI_RELEASE_VERSION=" >> $env:GITHUB_ENV
          }

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r apps/backend/requirements/production.txt -r apps/backend/requirements/development.txt

      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend release checks
        run: .venv\Scripts\pytest.exe -q tests/backend/test_main.py

      - name: Run desktop typecheck
        run: pnpm --filter shiori-desktop run typecheck

      - name: Run desktop unit tests
        run: pnpm test

      - name: Run packaging tests
        run: pnpm --filter shiori-desktop run test:package

      - name: Build Windows installer and unpacked artifact
        run: pnpm --filter shiori-desktop run package:win

      - name: Verify packaged layout
        run: pnpm --filter shiori-desktop run verify:package

      - name: Generate release checksums
        run: pnpm --filter shiori-desktop run hash:release

      - name: Verify release checksums
        shell: pwsh
        run: |
          $checksumPath = "apps/desktop/release/installer/SHA256SUMS.txt"
          foreach ($line in Get-Content $checksumPath) {
            if ($line -notmatch '^([0-9a-fA-F]{64})  (.+)$') {
              throw "Invalid checksum line: $line"
            }
            $expected = $Matches[1].ToLowerInvariant()
            $filePath = Join-Path (Split-Path $checksumPath) $Matches[2]
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $filePath).Hash.ToLowerInvariant()
            if ($actual -ne $expected) {
              throw "Checksum mismatch for $filePath"
            }
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Shiori-Windows-x64
          path: apps/desktop/release/installer/*
          if-no-files-found: error

      - name: Create draft GitHub Release
        if: github.event_name != 'schedule' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: apps/desktop/release/installer/*

      - name: Publish daily GitHub Release
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHIORI_DAILY_RELEASE_PLAN: ${{ needs.plan.outputs.plan }}
        run: node apps/desktop/scripts/daily-release.mjs publish apps/desktop/release/installer
