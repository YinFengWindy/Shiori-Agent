name: Site Pages

# Publishes the GitHub Pages redirect (apps/site/pages-redirect/) to the
# `gh-pages` branch, which is the repository's existing Pages source (legacy
# build, branch root). The site itself lives on Vercel at
# https://www.windchant.online; the old Pages URL only forwards there, so
# nothing is built here. Repository Pages settings are intentionally left
# unchanged.
on:
  push:
    branches:
      - main
    # Only the redirect page and this workflow change what is published. Use
    # workflow_dispatch (on main) to force a deploy.
    paths:
      - "apps/site/pages-redirect/**"
      - ".github/workflows/site-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

# Only the latest main matters for a deploy: a newer run supersedes older ones.
concurrency:
  group: site-pages
  cancel-in-progress: true

jobs:
  deploy:
    # workflow_dispatch can target any branch; only main may publish.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The token is not persisted into .git/config: only the publish step
      # below receives it.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Replace the whole gh-pages branch with a single parentless commit
      # holding only the redirect page, as index.html and as 404.html (Pages
      # serves 404.html for every unknown path, so deep links redirect too).
      # `.nojekyll` makes the legacy Pages build serve files as-is. The commit
      # is built with plumbing against a throwaway index, so the checkout's
      # working tree is untouched.
      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_DIR: apps/site/pages-redirect
          SOURCE_SHA: ${{ github.sha }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          test -f "$SITE_DIR/index.html"
          publish_dir="$RUNNER_TEMP/gh-pages"
          rm -rf "$publish_dir"
          mkdir -p "$publish_dir"
          cp "$SITE_DIR/index.html" "$publish_dir/index.html"
          cp "$SITE_DIR/index.html" "$publish_dir/404.html"
          touch "$publish_dir/.nojekyll"
          printf '{"kind":"redirect","sourceSha":"%s","builtAt":"%s"}\n' \
            "$SOURCE_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$publish_dir/build-info.json"
          export GIT_INDEX_FILE="$RUNNER_TEMP/gh-pages.index"
          rm -f "$GIT_INDEX_FILE"
          git --work-tree="$publish_dir" add --all --force .
          tree="$(git write-tree)"
          commit="$(git commit-tree "$tree" -m "Deploy Pages redirect from ${SOURCE_SHA}")"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force "$remote" "${commit}:refs/heads/gh-pages"
