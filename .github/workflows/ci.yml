name: CI

on:
  pull_request:
    branches:
      - main
      # Stacked feature PRs require the same complete jobs before their base merges.
      - "codex/**"

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip uv
          .venv/bin/python -m pip install -r apps/backend/requirements/production.txt
          .venv/bin/python -m pip install -r apps/backend/requirements/development.txt

      - name: Check Python formatting
        run: .venv/bin/black --check .
      - name: Run Ruff
        run: .venv/bin/ruff check .

      - name: Enforce SDK and plugin dependency boundaries
        run: .venv/bin/python -m scripts.check_sdk_imports

      - name: Run pyright
        run: |
          .venv/bin/pyright --level error
      - name: Run pyright for tests
        run: |
          .venv/bin/pyright --project pyrightconfig.tests.json --level error

      - name: Run pytest
        timeout-minutes: 10
        env:
          PYTHONWARNINGS: "ignore:.*AbstractEventLoopPolicy.*:DeprecationWarning"
        run: |
          # 不显式传路径：显式路径会覆盖 pytest.ini 的 testpaths
          # （宿主、plugins/*/tests/ 与 packages/sdk/tests），
          # 避免遗漏插件或公开 SDK 的用例（#178、#215）。
          .venv/bin/pytest -q -W error

      - name: Verify the installed host wheel and runtime resources
        run: .venv/bin/python -m scripts.verify_host_distribution

      - name: Set up pnpm for external plugin artifact validation
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js for external plugin artifact validation
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install plugin build dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build external plugin ZIP and validate it with the real host
        run: node --test scripts/build-plugin.test.mjs

      - name: Verify frozen runtime SDK imports for external plugins
        timeout-minutes: 5
        run: node apps/desktop/scripts/test-sdk-runtime.mjs --output "${{ runner.temp }}/sdk-runtime-probe"

      - name: Upload frozen SDK probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-runtime-probe
          path: |
            ${{ runner.temp }}/sdk-runtime-probe/collection.json
            ${{ runner.temp }}/sdk-runtime-probe/freeze.log
            ${{ runner.temp }}/sdk-runtime-probe/probe.json
          if-no-files-found: ignore

  plugin-isolation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The runner imports only packaging and the SDK's stdlib-only staging
      # helper; every plugin gets its own venv built from private wheels.
      - name: Install runner dependencies
        # packaging matches uv.lock; uv is not pinned anywhere in the repository.
        run: python -m pip install uv packaging==26.3

      - name: Verify portable plugin tests
        timeout-minutes: 20
        env:
          # Read from source so the SDK tree is not touched before its wheel
          # is built; the runner strips PYTHON* from every child process.
          PYTHONPATH: packages/sdk/python
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m scripts.verify_plugin_tests --output "${{ runner.temp }}/plugin-isolation"

      - name: Upload plugin isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-isolation-evidence
          path: |
            ${{ runner.temp }}/plugin-isolation/*.log
            ${{ runner.temp }}/plugin-isolation/*.txt
            ${{ runner.temp }}/plugin-isolation/results.json
            ${{ runner.temp }}/plugin-isolation/cases/*/*.log
            ${{ runner.temp }}/plugin-isolation/cases/*/provenance.json
          if-no-files-found: ignore

  desktop-check-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Run packaging and daily release tests
        run: pnpm --filter shiori-desktop run test:package

      - name: Run production build
        run: pnpm run build

      - name: Build static site skeleton
        run: pnpm run build:site

      # Prove the generated virtual modules include builtin UI, surface and
      # background entries, while excluding external source before parsing.
      # Invalid external JavaScript must not enter any host dependency graph.
      - name: Run plugin UI build smoke check
        run: pnpm run desktop:test:plugin-ui

  sdk-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install build tools and SDK only
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install uv packaging ./packages/sdk
          pnpm install --frozen-lockfile
      - name: Build and install npm SDK outside the repository
        run: pnpm run sdk:smoke
      - name: Build and install wheel and run pure SDK tests outside the repository
        run: .venv/bin/python -m scripts.verify_sdk

  windows-process-lifecycle:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Install isolated project environment
        run: uv sync --dev --locked
      - name: Verify owned process, MCP and turn lifecycle
        env:
          PYTHONUTF8: "1"
        run: .venv/Scripts/pytest.exe -q tests/backend/infra/process tests/backend/agent/mcp tests/backend/agent/tools/test_turn_scope.py tests/backend/agent/plugin_host/test_processes_browser_use.py tests/backend/agent/plugin_host/test_processes_computer_use.py plugins/browser_use/tests plugins/computer_use/tests tests/backend/agent/plugin_host/test_processes.py plugins/qq/tests/test_managed_napcat.py plugins/qq/tests/test_napcat_process_guard.py plugins/gpt_sovits_tts/tests/test_instance.py plugins/gpt_sovits_tts/tests/test_engine.py
