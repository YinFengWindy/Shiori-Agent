name: CI

on:
  pull_request:
    branches:
      - main
      # Stacked feature PRs require the same complete jobs before their base merges.
      - "codex/**"

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip uv
          .venv/bin/python -m pip install -r apps/backend/requirements/production.txt
          .venv/bin/python -m pip install -r apps/backend/requirements/development.txt

      - name: Check Python formatting
        run: .venv/bin/black --check .
      - name: Run Ruff
        run: .venv/bin/ruff check .

      - name: Run pyright
        run: |
          .venv/bin/pyright --level error
      - name: Run pyright for tests
        run: |
          .venv/bin/pyright --project pyrightconfig.tests.json --level error

      - name: Run pytest
        timeout-minutes: 10
        env:
          PYTHONWARNINGS: "ignore:.*AbstractEventLoopPolicy.*:DeprecationWarning"
        run: |
          # 不显式传路径：显式路径会覆盖 pytest.ini 的 testpaths
          # （宿主、plugins/*/tests/ 与 packages/plugin-testkit/tests），
          # 避免遗漏插件或公开 testkit 的用例（#178、#215）。
          .venv/bin/pytest -q -W error

      - name: Verify portable plugin tests
        timeout-minutes: 20
        run: .venv/bin/python scripts/verify_plugin_tests.py --output "${{ runner.temp }}/plugin-isolation"

      - name: Upload plugin isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-isolation-evidence
          path: |
            ${{ runner.temp }}/plugin-isolation/*.log
            ${{ runner.temp }}/plugin-isolation/*.txt
            ${{ runner.temp }}/plugin-isolation/results.json
            ${{ runner.temp }}/plugin-isolation/cases/*/*.log
            ${{ runner.temp }}/plugin-isolation/cases/*/provenance.json
          if-no-files-found: ignore

  desktop-check-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Run production build
        run: pnpm run build

      - name: Build static site skeleton
        run: pnpm run build:site

      # The only check that proves the two `import.meta.glob` patterns for
      # colocated plugin UI (`plugins/<id>/ui/` and `plugins/<id>/surface/`)
      # actually resolve. `pnpm run build` above cannot: a glob matching
      # nothing builds perfectly. Load-bearing since #181-B, where the desktop
      # pet's renderer became the first real `surface/` match — a broken glob
      # would ship a host with no pet in it and every other gate still green.
      - name: Run plugin UI build smoke check
        run: pnpm run desktop:test:plugin-ui
