[pytest]
addopts = -W error --import-mode=importlib
pythonpath = . apps/backend
# Default CI collects tests/backend only, and tests/conftest.py keeps the
# contract subset (~1000 cases). Plugin tests run in plugin-isolation;
# SDK tests run in verify_sdk. Host regressions: pytest --extended
testpaths = tests/backend
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
required_plugins = pytest-asyncio shiori-sdk shiori-host-testing
markers =
    extended: host regression outside the default CI selection; pytest --extended
