[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiori-plugin-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["shiori-mcp-client==0.1.0", "shiori-sdk>=4.1.0,<4.2.0", "pydantic>=2.12.0", "mcp==2.3.0", "httpx2>=2.3.0,<3"]

[project.optional-dependencies]
test = ["shiori-sdk[testing]>=4.1.0,<4.2.0"]

[tool.setuptools]
include-package-data = false
packages = ["plugins.mcp", "plugins.mcp.backend"]
package-dir = {"plugins.mcp" = "."}

[tool.setuptools.package-data]
"plugins.mcp" = ["manifest.yaml", "TESTING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-W error --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
required_plugins = ["pytest-asyncio", "shiori-sdk"]
