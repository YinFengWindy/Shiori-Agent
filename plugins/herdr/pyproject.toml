[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiori-plugin-herdr"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["shiori-sdk>=3.1.1,<4", "pydantic>=2.11.7"]

[project.optional-dependencies]
test = ["shiori-sdk[testing]>=3.1.1,<4"]

[tool.setuptools]
include-package-data = false
packages = ["plugins.herdr", "plugins.herdr.backend"]
package-dir = {"plugins.herdr" = "."}

[tool.setuptools.package-data]
"plugins.herdr" = ["manifest.yaml", "TESTING.md", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-W error --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
required_plugins = ["pytest-asyncio", "shiori-sdk"]
