[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiori-plugin-pet-codex-sprite"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["shiori-sdk>=4.0.1,<5", "shiori-plugin-desktop-pet>=0.1.3", "pillow>=11.3.0"]

[project.optional-dependencies]
test = ["shiori-sdk[testing]>=4.0.1,<5"]

[tool.setuptools]
include-package-data = false
packages = ["plugins.pet_codex_sprite", "plugins.pet_codex_sprite.backend"]
package-dir = {"plugins.pet_codex_sprite" = "."}

[tool.setuptools.package-data]
"plugins.pet_codex_sprite" = ["manifest.yaml", "TESTING.md", "backend/**/*.json", "backend/**/*.yaml", "backend/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-W error --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
required_plugins = ["pytest-asyncio", "shiori-sdk"]
