[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiori-plugin-gpt-sovits-tts"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["shiori-sdk>=3.1.1,<4", "httpx>=0.28.1", "pydantic>=2.12.0"]

[project.optional-dependencies]
test = ["shiori-sdk[testing]>=3.1.1,<4"]

[tool.setuptools]
include-package-data = false
packages = ["plugins.gpt_sovits_tts", "plugins.gpt_sovits_tts.backend"]
package-dir = {"plugins.gpt_sovits_tts" = "."}

[tool.setuptools.package-data]
"plugins.gpt_sovits_tts" = ["manifest.yaml", "README.md", "TESTING.md", "runtime_assets/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-W error --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
required_plugins = ["pytest-asyncio", "shiori-sdk"]
