[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiori-plugin-plugin-undo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["shiori-sdk>=3.1.0,<4"]

[project.optional-dependencies]
test = ["shiori-sdk[testing]>=3.1.0,<4"]

[tool.setuptools]
include-package-data = false
packages = ["plugins.plugin_undo", "plugins.plugin_undo.backend"]
package-dir = {"plugins.plugin_undo" = "."}

[tool.setuptools.package-data]
"plugins.plugin_undo" = ["manifest.yaml", "TESTING.md", "backend/**/*.json", "backend/**/*.yaml", "backend/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-W error --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
required_plugins = ["pytest-asyncio", "shiori-sdk"]
