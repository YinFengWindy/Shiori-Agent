[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiori-plugin-browser-use"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["shiori-agent==0.1.0"]

[project.optional-dependencies]
test = ["shiori-plugin-testkit==0.1.0"]

[tool.setuptools]
include-package-data = false
packages = ["plugins.browser_use", "plugins.browser_use.backend"]
package-dir = {"plugins.browser_use" = "."}

[tool.setuptools.package-data]
"plugins.browser_use" = ["manifest.yaml", "TESTING.md", "README.md", "native-runtime.json", "LICENSE.agent-browser", "backend/**/*.json", "backend/**/*.yaml", "backend/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-W error --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
required_plugins = ["pytest-asyncio", "shiori-plugin-testkit"]
