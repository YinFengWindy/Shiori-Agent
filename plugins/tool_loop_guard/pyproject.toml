[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiori-plugin-tool-loop-guard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["shiori-sdk>=3.1.0,<4", "pydantic>=2"]

[project.optional-dependencies]
test = ["shiori-sdk[testing]>=3.1.0,<4"]

[tool.setuptools]
include-package-data = false
packages = ["plugins.tool_loop_guard", "plugins.tool_loop_guard.backend"]
package-dir = {"plugins.tool_loop_guard" = "."}

[tool.setuptools.package-data]
"plugins.tool_loop_guard" = ["manifest.yaml", "TESTING.md", "backend/**/*.json", "backend/**/*.yaml", "backend/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-W error --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
required_plugins = ["pytest-asyncio", "shiori-sdk"]
