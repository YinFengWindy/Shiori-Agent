[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiori-plugin-schedule"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["shiori-sdk>=4.0.0,<5", "APScheduler>=3.11.2", "tzdata>=2025.2; sys_platform == 'win32'"]

[project.optional-dependencies]
test = ["shiori-sdk[testing]>=4.0.0,<5"]

[tool.setuptools]
include-package-data = false
packages = ["plugins.schedule", "plugins.schedule.backend"]
package-dir = {"plugins.schedule" = "."}

[tool.setuptools.package-data]
"plugins.schedule" = ["manifest.yaml", "TESTING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-W error --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
required_plugins = ["pytest-asyncio", "shiori-sdk"]
