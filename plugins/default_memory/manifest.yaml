api: 4
sdk: ">=4.0.0"
id: default_memory
display_name: 默认记忆引擎
version: 0.1.1
desc: 在 setup 中构造默认记忆引擎并提供 memory_engine；注册 memorize / recall_memory / forget_memory，并记录检索与召回轨迹
category: system
config_model: config:DefaultMemoryPluginConfig
inject:
  - main_provider
  - main_model
  - memory
  - rpc
  - config
  - tools
  - http
  - events
  - light_provider
  - light_model
  - runtime
provides:
  - memory_engine
