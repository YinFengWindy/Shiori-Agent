[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiori-plugin-fish-audio"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["shiori-sdk>=4.1.0,<4.2.0", "httpx>=0.28.1", "pydantic>=2.12.0"]

[project.optional-dependencies]
test = ["shiori-sdk[testing]>=4.1.0,<4.2.0"]

[tool.setuptools]
include-package-data = false
packages = ["plugins.fish_audio", "plugins.fish_audio.backend"]
package-dir = {"plugins.fish_audio" = "."}

[tool.setuptools.package-data]
"plugins.fish_audio" = ["manifest.yaml", "README.md", "TESTING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-W error --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
required_plugins = ["pytest-asyncio", "shiori-sdk"]
