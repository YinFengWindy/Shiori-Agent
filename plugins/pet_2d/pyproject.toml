[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiori-plugin-pet-2d"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["shiori-sdk>=4.1.3,<4.2.0", "shiori-plugin-desktop-pet>=0.1.5", "pillow>=11.3.0"]

[project.optional-dependencies]
test = ["shiori-sdk[testing]>=4.1.3,<4.2.0"]

[tool.setuptools]
include-package-data = false
packages = ["plugins.pet_2d", "plugins.pet_2d.backend"]
package-dir = {"plugins.pet_2d" = "."}

[tool.setuptools.package-data]
"plugins.pet_2d" = ["manifest.yaml", "geometry-limits.json", "backend/**/*.json", "backend/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-W error --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
required_plugins = ["pytest-asyncio", "shiori-sdk"]
