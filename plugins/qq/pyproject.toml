[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiori-plugin-qq"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "shiori-sdk>=3.1.0,<5",
    "httpx>=0.28.1",
    "psutil>=7.0",
    "websockets>=15.0,<16",
]

[project.optional-dependencies]
test = ["shiori-sdk[testing]>=3.1.0,<5", "qrcode>=8.2", "Pillow>=11.0"]

[tool.setuptools]
include-package-data = false
packages = [
    "plugins.qq",
    "plugins.qq.backend",
    "plugins.qq.backend.channel",
]
package-dir = {"plugins.qq" = "."}

[tool.setuptools.package-data]
"plugins.qq" = ["manifest.yaml", "TESTING.md", "NAPCAT-NOTICE.md", "backend/**/*.json", "backend/**/*.yaml", "backend/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-W error --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
required_plugins = ["pytest-asyncio", "shiori-sdk"]
