[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiori-plugin-feishu"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["shiori-sdk>=3.1.0,<4", "httpx>=0.28.1", "pydantic>=2.11", "lark-oapi>=1.7.3,<2"]

[project.optional-dependencies]
test = ["shiori-sdk[testing]>=3.1.0,<4", "Pillow>=11.0"]

[tool.setuptools]
include-package-data = false
packages = ["plugins.feishu", "plugins.feishu.backend"]
package-dir = {"plugins.feishu" = "."}

[tool.setuptools.package-data]
"plugins.feishu" = ["manifest.yaml", "README.md", "TESTING.md", "backend/**/*.json", "backend/**/*.yaml", "backend/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-W error --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
required_plugins = ["pytest-asyncio", "shiori-sdk"]
