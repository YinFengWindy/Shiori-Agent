[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiori-plugin-desktop-pet"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["shiori-sdk>=4.0.0,<5", "pillow>=11.3.0", "pydantic>=2.12.0"]

[project.optional-dependencies]
test = ["shiori-sdk[testing]>=4.0.0,<5"]

[tool.setuptools]
include-package-data = false
packages = ["plugins.desktop_pet", "plugins.desktop_pet.backend"]
package-dir = {"plugins.desktop_pet" = "."}

[tool.setuptools.package-data]
"plugins.desktop_pet" = ["manifest.yaml", "TESTING.md", "backend/**/*.json", "backend/**/*.yaml", "backend/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-W error --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
required_plugins = ["pytest-asyncio", "shiori-sdk"]
