api: 4
sdk: ">=4.0.0"
id: novelai
display_name: NovelAI 生图
version: '0.1.3'
desc: NovelAI 生图集成——手动生图、提示词标签库、生成历史、消息图片重生成与自动场景 CG
default_enabled: false
config_model: config:NovelAIConfig
inject:
  - background
  - http
  - tools
  - events
  - light_provider
  - light_model
  - kv
  - config
  - rpc
  - workspace
  - roles
  - session_store
optional_inject:
  - scene
frontend:
  entry: ui/index.tsx
