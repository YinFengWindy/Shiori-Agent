[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiori-plugin-qqbot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["shiori-sdk==3.0.0", "httpx>=0.28.1", "websockets>=15.0"]

[project.optional-dependencies]
test = ["shiori-sdk[testing]==3.0.0"]

[tool.setuptools]
include-package-data = false
packages = ["plugins.qqbot", "plugins.qqbot.backend", "plugins.qqbot.testing"]
package-dir = {"plugins.qqbot" = "."}

[tool.setuptools.package-data]
"plugins.qqbot" = ["manifest.yaml", "TESTING.md", "backend/**/*.json", "backend/**/*.yaml", "backend/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-W error --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
required_plugins = ["pytest-asyncio", "shiori-sdk"]
