[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiori-plugin-natural-chat"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["shiori-sdk>=3.1.2,<4"]

[project.optional-dependencies]
test = ["shiori-sdk[testing]>=3.1.2,<4"]

[tool.setuptools]
include-package-data = false
packages = ["plugins.natural_chat", "plugins.natural_chat.backend"]
package-dir = {"plugins.natural_chat" = "."}

[tool.setuptools.package-data]
"plugins.natural_chat" = ["manifest.yaml", "TESTING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-W error --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
required_plugins = ["pytest-asyncio", "shiori-sdk"]
