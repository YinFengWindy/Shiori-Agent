[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiori-agent"
version = "0.1.0"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/conftest.py" = ["F401"]

[dependency-groups]
dev = [
    "qrcode>=8.2",
    "rich>=15.0.0",
    "shiori-plugin-testkit==0.1.0",
    "shiori-host-testing==0.1.0",
    "black>=26.0.0",
    "ruff>=0.15",
    "pyright>=1.1.403",
    "pytest-cov>=6.0.0",
    "pyinstaller>=6.18.0",
]


[tool.uv.sources]
shiori-host-testing = { path = "packages/shiori-host-testing", editable = true }
shiori-sdk = { path = "packages/sdk", editable = true }
shiori-plugin-default-memory = { path = "plugins/default_memory", editable = true }
shiori-plugin-testkit = { path = "packages/shiori-plugin-testkit", editable = true }
