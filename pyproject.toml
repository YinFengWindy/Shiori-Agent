[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiori-agent"
version = "0.1.0"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/conftest.py" = ["F401"]

[dependency-groups]
dev = [
    "qrcode>=8.2",
    "rich>=15.0.0",
    "shiori-host-testing==0.1.0",
    "shiori-plugin-herdr[test]==0.1.1",
    "black>=26.0.0",
    "ruff>=0.15",
    "pyright>=1.1.403",
    "import-linter==2.15",
    "jsonschema==4.26.0",
    "pytest-cov>=6.0.0",
    "pyinstaller>=6.18.0",
]


[tool.uv.sources]
shiori-host-testing = { path = "packages/shiori-host-testing", editable = true }
shiori-sdk = { path = "packages/sdk", editable = true }
shiori-plugin-default-memory = { path = "plugins/default_memory", editable = true }

shiori-plugin-herdr = { path = "plugins/herdr", editable = true }

# 四层分层契约（docs/decisions/2026-10-22-plugin-system-four-layer-refactor.md §5.4），
# P2（#901）起在 CI 阻塞：契约全部保持，任何新违规都会让 CI 失败。不得用
# ignore_imports 按迁移豁免。scripts.check_sdk_imports 仍阻塞它覆盖不到的规则，
# 两者的规则对照见 docs/decisions/2026-10-22-plugin-import-rules-mapping.md。
# 只查直接 import：间接链由 shiori_sdk.kernel 的「只许 import 内核自身和标准库」收紧。
# include_external_packages 让第三方包进图，内核契约据此拒绝 import 任何第三方包。
# 宿主包列表与 setup.py 的 HOST_PACKAGES 一致（shiori_runtime_resources 只放资源）。
[tool.importlinter]
root_packages = [
    "agent",
    "bootstrap",
    "bus",
    "conversation",
    "core",
    "desktop_bridge",
    "infra",
    "proactive_v2",
    "prompts",
    "session",
    "utils",
    "plugins",
    "shiori_sdk",
    "shiori_host_testing",
    "tests",
]
include_external_packages = true
contract_types = [
    "manifest_dependencies: scripts.plugin_import_contract.ManifestDependencyContract",
    "kernel_isolation: scripts.plugin_import_contract.KernelIsolationContract",
]

[[tool.importlinter.contracts]]
name = "内核 shiori_sdk.kernel 只 import 内核自身和标准库"
type = "kernel_isolation"

[[tool.importlinter.contracts]]
name = "内核（现 agent.plugin_host）不 import 宿主业务模块和插件"
type = "forbidden"
source_modules = ["agent.plugin_host"]
forbidden_modules = [
    "agent.*",
    "bootstrap",
    "bus",
    "conversation",
    "core",
    "desktop_bridge",
    "infra",
    "proactive_v2",
    "prompts",
    "session",
    "utils",
    "plugins",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "核心模块不 import 插件"
type = "forbidden"
source_modules = [
    "agent",
    "bootstrap",
    "bus",
    "conversation",
    "core",
    "desktop_bridge",
    "infra",
    "proactive_v2",
    "prompts",
    "session",
    "utils",
]
forbidden_modules = ["plugins"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "SDK 和插件不 import 宿主"
type = "forbidden"
source_modules = ["shiori_sdk", "plugins"]
forbidden_modules = [
    "shiori_host_testing",
    "tests",
    "agent",
    "bootstrap",
    "bus",
    "conversation",
    "core",
    "desktop_bridge",
    "infra",
    "proactive_v2",
    "prompts",
    "session",
    "utils",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "SDK 不 import 插件"
type = "forbidden"
source_modules = ["shiori_sdk"]
forbidden_modules = ["plugins"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "插件只 import manifest 声明的依赖插件"
type = "manifest_dependencies"
