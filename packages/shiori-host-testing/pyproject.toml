[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiori-host-testing"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["shiori-agent==0.1.0", "shiori-sdk[testing]==3.1.11"]

[project.entry-points.pytest11]
shiori_host_testing = "shiori_host_testing.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]
