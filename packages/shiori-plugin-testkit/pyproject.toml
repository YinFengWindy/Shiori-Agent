[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiori-plugin-testkit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["shiori-host-testing==0.1.0", "pytest>=9.0", "pytest-asyncio>=1.3"]

[project.entry-points.pytest11]
shiori_plugin_testkit = "shiori_plugin_testkit.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]
