[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiori-mcp-client"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["shiori-sdk>=4.1.0,<4.2.0", "mcp==2.3.0"]

[project.optional-dependencies]
test = ["shiori-sdk[testing]>=4.1.0,<4.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shiori_mcp_client = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-W error --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
required_plugins = ["pytest-asyncio", "shiori-sdk"]
